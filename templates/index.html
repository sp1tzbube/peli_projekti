<!DOCTYPE html>
<html lang="fi">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <title>Moomin Runner</title>
</head>
<main class="app"></main>
<body>
    <!-- Start menu -->
    <section id=" start-screen" class="screen active">
        <form id ="start-form">
            <label for="player-name">Pelaajan nimi:</label>
            <input type="text" id="player-name" maxlength="15" required>
            <button type="submit">Play</button>
        </form>
        <p class="hint">Space/ = hyppää </p>
        <h2>Top 10</h2>
        <ol id="leaderbord"></ol>
    </section>
    <!-- Game screen ---->
     <section id="game-section" class="screen">
        <p>Score: <strong id="score">0</strong></p>
        <canvas id="game-canvas" width="800" height="600"></canvas>
     </section>
     <!-- Game over screen----->
      <section id="over-screen" class="screen">
        <h2>Game over</h2>
        <p>Your Score: <strong id="final-score">0</strong></p>
        <button id="restart-button">Play Again</button>
        <button id="menu-btn" type="button">Menu</button>
      </section>
    <script type="module" scr="{{url_for('static', filename='js/main.js')}}">
    </script>
</body>
</html>
